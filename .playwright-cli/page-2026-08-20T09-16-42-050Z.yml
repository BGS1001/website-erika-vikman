  - main [ref=f9e21]:
    - generic [ref=f9e24]:
      - text: Biography
      - heading "The Tango Queen of Finland" [level=1] [ref=f9e25]: The Tango Queenof Finland
    - paragraph [ref=f9e28]: Erika Susanna Vikman spent a decade earning her place in Finland's oldest musical tradition before she blew it open — and then took the result to Basel on a flaming golden microphone.
    - generic [ref=f9e30]:
      - generic [ref=f9e31]: The road
      - heading "From Tampere to Basel." [level=2] [ref=f9e32]:
        - generic [ref=f9e33]: From
        - generic [ref=f9e35]: Tampere
        - emphasis [ref=f9e37]:
          - generic [ref=f9e38]: to
          - generic [ref=f9e40]: Basel.
      - generic [ref=f9e42]:
        - article [ref=f9e43]:
          - generic [ref=f9e44]: "1993"
          - generic [ref=f9e45]:
            - heading "Born into it" [level=3] [ref=f9e46]
            - paragraph [ref=f9e47]: Born on 20 February in Tampere, Finland, and raised between Lempäälä and Pori. Her mother was a tango singer who competed at Tangomarkkinat — Finland's storied tango festival — and her younger sister Jennika sings too.
        - article [ref=f9e48]:
          - generic [ref=f9e49]: "2013"
          - generic [ref=f9e50]:
            - heading "Idols, and a wildcard" [level=3] [ref=f9e51]
            - paragraph [ref=f9e52]:
              - text: Her professional road starts on season seven of Finnish
              - emphasis [ref=f9e53]: Idols
              - text: ", where a wildcard return carries her to seventh place."
        - article [ref=f9e54]:
          - generic [ref=f9e55]: "2016"
          - generic [ref=f9e56]:
            - heading "Tango Queen of Finland" [level=3] [ref=f9e57]
            - paragraph [ref=f9e58]: Runner-up at Tangomarkkinat in 2015, she returns the following year and wins outright — taking the title that still follows her name.
            - figure "The look that came later — leather, spikes, gold" [ref=f9e59]:
              - img "Erika Vikman backstage in a studded corset" [ref=f9e60]
        - article [ref=f9e62]:
          - generic [ref=f9e63]: "2020"
          - generic [ref=f9e64]:
            - heading "Cicciolina, and the turn to pop" [level=3] [ref=f9e65]
            - paragraph [ref=f9e66]: "\"Cicciolina\" — named after the Hungarian-Italian performer and politician Ilona Staller — places second at Uuden Musiikin Kilpailu but becomes her first top-five hit. \"Syntisten pöytä\" follows to number three and gives her a first number-one radio hit."
            - paragraph [ref=f9e67]:
              - text: The same year she competes as "The Wasp" on
              - emphasis [ref=f9e68]: Masked Singer Suomi
              - text: ", finishing third, and publicly comes out as bisexual."
        - article [ref=f9e69]:
          - generic [ref=f9e70]: "2021"
          - generic [ref=f9e71]:
            - heading "A number-one debut" [level=3] [ref=f9e72]
            - paragraph [ref=f9e73]: Her self-titled debut album arrives in August and goes straight to number one in Finland — proof the tango hall had built a pop star made to last.
            - figure "Off duty" [ref=f9e74]:
              - img "Erika Vikman off stage in a denim jacket" [ref=f9e75]
        - article [ref=f9e77]:
          - generic [ref=f9e78]: "2025"
          - generic [ref=f9e79]:
            - heading "Ich Komme — Basel" [level=3] [ref=f9e80]
            - paragraph [ref=f9e81]: Written and produced by Christel and Jori Roosberg, released through Warner Music Finland and Mökkitie Records, "Ich Komme" wins Uuden Musiikin Kilpailu on a 75% public / 25% jury split and carries Finland to the Eurovision Song Contest.
            - paragraph [ref=f9e82]:
              - text: She qualifies third from her semi-final with 115 points, then finishes
              - strong [ref=f9e83]: 11th in the Grand Final with 196
              - text: — the performance defined by being hoisted skyward on a giant golden microphone stand, throwing fireworks over the arena.
            - figure "The golden microphone, Basel 2025" [ref=f9e84]:
              - img "Erika Vikman lifted on the golden microphone at Eurovision 2025" [ref=f9e85]
